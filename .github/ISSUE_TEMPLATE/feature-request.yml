name: Feature request
description: Propose an improvement to a reusable module or documented example.
title: "[feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user or operator need is not met today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired interface and resulting behavior.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and operational impact
      description: Note migration, state, security, backup, or deployment implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
