name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 0"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  discover:
    name: Discover CI inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lockfiles: ${{ steps.inventory.outputs.lockfiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: inventory
        uses: nix-forge/ci/actions/discover-lockfiles@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
  lock-health:
    name: Flake lock health
    needs: [flake-lock]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every discovered lockfile to pass
        env:
          LOCK_RESULT: ${{ needs.flake-lock.result }}
        run: test "$LOCK_RESULT" = success
  flake-lock:
    needs: [discover]
    name: Flake Lock (${{ matrix.lockfile }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lockfile: ${{ fromJSON(needs.discover.outputs.lockfiles) }}
    uses: nix-forge/ci/.github/workflows/flake-lock.yml@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
    with:
      lockfile: ${{ matrix.lockfile }}
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
        with:
          cache: "false"
          cache-scope: ci-format
      - name: Check formatting
        run: nix fmt -- --fail-on-change
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
        with:
          cache: "false"
          cache-scope: ci-lint
      - name: Check shared workflow contracts
        uses: nix-forge/ci/actions/validate-workflows@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
      - name: Run repository hooks and publication checks
        uses: nix-forge/ci/actions/repository-checks@bb1b39a9082f72dc6c7ce596103ce7a5e4d29b01 # v2.8.0
        with:
          hook-runner: prek
  flake-check:
    name: Flake Check (${{ matrix.label }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && 120 || 30 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            label: x86_64-linux 1/4
            runs_on: ubuntu-24.04
            partition-count: 4
            partition-index: 0
          - system: x86_64-linux
            label: x86_64-linux 2/4
            runs_on: ubuntu-24.04
            partition-count: 4
            partition-index: 1
          - system: x86_64-linux
            label: x86_64-linux 3/4
            runs_on: ubuntu-24.04
            partition-count: 4
            partition-index: 2
          - system: x86_64-linux
            label: x86_64-linux 4/4
            runs_on: ubuntu-24.04
            partition-count: 4
            partition-index: 3
          - system: aarch64-linux
            label: aarch64-linux
            runs_on: ubuntu-24.04-arm
            partition-count: 1
            partition-index: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: nix-forge/ci/actions/setup-nix@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
        with:
          cache: "false"
          cache-scope: ci-flake-check
      - name: Enable KVM for NixOS runtime tests
        if: matrix.system == 'x86_64-linux'
        run: sudo chmod a+rw /dev/kvm
      - name: Run native checks
        uses: nix-forge/ci/actions/flake-checks@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
        with:
          system: ${{ matrix.system }}
          partition-count: ${{ matrix.partition-count }}
          partition-index: ${{ matrix.partition-index }}
          weights-file: .github/ci-check-weights.json
          checks-output: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
            && 'checks' || 'ciChecks' }}
  queue-completion:
    continue-on-error: true
    name: Queue completion callback
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, format('refs/heads/gh-readonly-queue/{0}/',
      github.event.repository.default_branch))
    needs: [lock-health, discover, flake-lock, format, lint, flake-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Dispatch trusted queue validation.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@4f58fd74e91957fa257cb48e2fa2687e09689e2c # v2.8.0
