name: Fuzz integration URLs
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '7 9 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api-url:
    name: Fuzz API endpoint URLs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nix-forge/ci/actions/fuzz-atheris@13ad6e366ec01e317705d750fc512d33ecc15f6c # v2.9.0-compatible fuzz action
        with:
          target: fuzz/api_url_fuzzer.py
          python-version: '3.14'
  queue-completion:
    continue-on-error: true
    name: Queue completion callback
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, format('refs/heads/gh-readonly-queue/{0}/',
      github.event.repository.default_branch))
    needs: [api-url]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Dispatch trusted queue validation.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@13ad6e366ec01e317705d750fc512d33ecc15f6c # v2.9.0
