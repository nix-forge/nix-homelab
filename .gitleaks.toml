[extend]
useDefault = true

# Public, disposable values used by the native application fixtures. Matching
# values outside tests, and all other values inside tests, remain scanned.
[[allowlists]]
description = "Known disposable application fixture credentials"
condition = "AND"
targetRules = ["generic-api-key", "curl-auth-header", "curl-auth-user"]
paths = ['''(^|/)tests/(fixtures|integration|nixos)/''']
regexes = [
  '''^(0123456789abcdef0123456789abcdef|abcdef0123456789abcdef0123456789)(\\n)?$''',
  '''^(operator:)?public-(original|rotated)-password$''',
  '''^((admin|fixture):)?disposable-password$''',
  '''^admin:wrong$''',
  '''^fedcba9876543210fedcba9876543210$''',
  '''^(nzbget:)?tegbzn6789$''',
]

# The Miniflux test reads its generated password at runtime. Gitleaks spans the
# Python string concatenation and treats source text as a curl credential.
[[allowlists]]
description = "Miniflux test command assembled from a runtime fixture credential"
condition = "AND"
targetRules = ["curl-auth-user"]
paths = ['''(^|/)tests/nixos/(miniflux\.nix|scripts/miniflux_test\.py)$''']
regexTarget = "secret"
regexes = [
  '''^admin:" \+ auth\n(    )?user = json\.loads\(machine\.succeed\(command \+ "$''',
]
