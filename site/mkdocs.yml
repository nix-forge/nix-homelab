site_name: nix-homelab
site_description: Composable NixOS media and homelab services with VPN confinement.
site_url: https://nix-forge.github.io/nix-homelab/
repo_url: https://github.com/nix-forge/nix-homelab
repo_name: nix-forge/nix-homelab
docs_dir: source
site_dir: dist
strict: true
hooks:
  - rewrite_source_links.py
theme:
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true
  locale: en
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: info
    anchors: warn
    unrecognized_links: info
nav:
  - Overview: index.md
  - Setup: docs/setup.md
  - Storage and recovery: docs/storage.md
  - Application integration: docs/integration.md
  - VPN confinement: docs/vpn.md
  - Operations: docs/operations.md
  - Production readiness: docs/readiness.md
  - Optional services: docs/optional-services.md
  - Testing and evidence: docs/testing.md
  - Compatibility policy: docs/compatibility.md
  - Release process: docs/releases.md
  - Roadmap: docs/roadmap.md
  - Reference:
      - Module options: docs/generated/options.md
      - Service support matrix: docs/generated/support-matrix.md
  - Project:
      - Security: SECURITY.md
      - Contributing: CONTRIBUTING.md
